<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⭐ Starson ViewBoost☑️ - Login Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050816,#0f172a,#1e1b4b);
overflow:hidden;
}

/* Background Glow */

.glow{
position:absolute;
width:400px;
height:400px;
border-radius:50%;
background:#8b5cf6;
filter:blur(150px);
opacity:.20;
}

.glow.one{
top:-150px;
left:-150px;
}

.glow.two{
bottom:-150px;
right:-150px;
}

/* Login Card */

.login-card{
width:95%;
max-width:420px;
background:rgba(15,23,42,.95);
backdrop-filter:blur(20px);
padding:35px;
border-radius:24px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 40px rgba(139,92,246,.25);
z-index:10;
animation:fadeIn .8s ease;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h1{
font-size:30px;
color:white;
}

.logo span{
color:#8b5cf6;
}

.logo p{
color:#94a3b8;
margin-top:8px;
font-size:14px;
}

/* Inputs */

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#cbd5e1;
font-size:14px;
}

.input-box{
display:flex;
align-items:center;
background:#111827;
border:1px solid rgba(255,255,255,.05);
border-radius:14px;
padding:14px;
}

.input-box i{
color:#8b5cf6;
margin-right:10px;
}

.input-box input{
width:100%;
border:none;
outline:none;
background:none;
color:white;
font-size:15px;
}

/* Button */

.login-btn{
width:100%;
padding:15px;
background:#8b5cf6;
border:none;
border-radius:14px;
font-size:16px;
font-weight:700;
color:white;
cursor:pointer;
transition:.3s;
margin-top:10px;
}

.login-btn:hover{
background:#7c3aed;
transform:translateY(-2px);
}

/* Footer */

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#94a3b8;
}

/* Error */

.error{
margin-top:15px;
text-align:center;
color:#ef4444;
display:none;
}

/* Animation */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="login-card">

<div class="logo">
<h1>⭐ Starson <span>ViewBoost☑️</span></h1>
<p>Premium Admin Dashboard</p>
</div>

<form id="loginForm">

<div class="input-group">
<label>Email Admin</label>
<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input
type="email"
id="email"
placeholder="admin@starson.com"
required>
</div>
</div>

<div class="input-group">
<label>Mot de passe</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="password"
placeholder="********"
required>
</div>
</div>

<button class="login-btn" type="submit">
<i class="fa-solid fa-right-to-bracket"></i>
 Connexion
</button>

<div class="error" id="error">
Email ou mot de passe incorrect.
</div>

</form>

<div class="footer">
⭐ Starson ViewBoost☑️ <br>
More Contacts • Better Results
</div>

</div>

<script>

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(e){

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const adminEmail = "admin@starson.com";
const adminPassword = "admin123";

if(email === adminEmail && password === adminPassword){

localStorage.setItem("starson_admin","true");

window.location.href = "dashboard.html";

}else{

document.getElementById("error").style.display = "block";

}

});

</script>

</body>
</html>
